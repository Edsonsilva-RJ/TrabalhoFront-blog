<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel&Luz | Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon_io/android-chrome-192x192.png" sizes="32x32" type="image/x-icon">
    <meta name="theme-color" content="#6322a3">
</head>
<body>
    <style>
    </style>
    <header>
        <h1>Cadastro - Pixel&Luz</h1>
        <nav>
            <ul>
                
                <li><a href="index.html">Home</a></li>
                
                <li><button id="btn-tema">Alternar Tema</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="cadastro">
            <h2>Crie sua conta</h2>
            <form id="form-cadastro" class="form-cadastro">
                <input type="text" id="nome" placeholder="Seu Nome" required>
                <input type="email" id="email" placeholder="Seu E-mail" required>
                <input type="password" id="senha" placeholder="Sua Senha" required>
                <input type="number" id="cont" placeholder="Seu número" required>
                <input type="number" id="cpf" placeholder="Digite seu CPF" required>
                <button type="submit" class="btn-trabalho">Cadastrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pixel&Luz - Projeto SENAI Jacarepaguá.</p>
    </footer>

    <script src="script.js"></script>
